 xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1838" />
      <stop offset="50%" stop-color="#120e24" />
      <stop offset="100%" stop-color="#0b0816" />
    </linearGradient>

    <!-- Outer Rim Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Left Pillar Gradient -->
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Diagonal Ribbon Gradient -->
    <linearGradient id="diagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Right Pillar Gradient -->
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#7c3aed" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Radial Top-Left Light Aura -->
  <circle cx="120" cy="120" r="140" fill="#8b5cf6" opacity="0.16" filter="blur(30px)" />

  <!-- Glowing Modern "N" Group -->
  <g filter="url(#purpleGlow)">
    <!-- Left Stem -->
    <rect x="136" y="128" width="60" height="256" rx="18" fill="url(#leftGrad)" />

    <!-- Diagonal Bridge Ribbon -->
    <polygon points="136,140 200,128 376,372 312,384" fill="url(#diagGrad)" />

    <!-- Right Stem -->
    <rect x="316" y="128" width="60" height="256" rx="18" fill="url(#rightGrad)" />
  </g>

  <!-- Specular Highlights on Vertex Points -->
  <circle cx="150" cy="144" r="8" fill="#ffffff" opacity="0.85" />
  <circle cx="362" cy="368" r="8" fill="#ffffff" opacity="0.75" />
</svg>{
  